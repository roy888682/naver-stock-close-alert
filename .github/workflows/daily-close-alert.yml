name: Daily close alert (07:00 KST)

on:
  schedule:
    - cron: '0 7 * * 2-6'
      timezone: Asia/Seoul
    # Retry missed runs; durable daily state prevents duplicate email.
    - cron: '20 7 * * 2-6'
      timezone: Asia/Seoul
  workflow_dispatch:
    inputs:
      action:
        description: 'check=오늘 전체 목록 발송, check-only=미발송 확인, test-digest=전체 목록 테스트, test-email=SMTP 테스트, lookup=종목명 조회'
        type: choice
        options: [check-only, check, test-digest, test-email, lookup]
        default: check-only
      market:
        description: 'lookup 시장'
        type: choice
        options: [KR, US]
        default: KR
      ticker:
        description: 'lookup 티커'
        type: string
        default: '005930'

permissions:
  contents: write

concurrency:
  group: stock-close-alert-state
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOOKUP_MARKET: ${{ inputs.market || 'KR' }}
      LOOKUP_TICKER: ${{ inputs.ticker || '005930' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select GitHub scheduled or manual action
        id: action
        run: python scripts/site_bridge.py --select-only
      - name: Read the live private Site watchlist
        if: contains(fromJSON('["check","check-only","test-digest"]'), steps.action.outputs.action)
        env:
          SITE_SERVICE_TOKEN: ${{ secrets.SITE_SERVICE_TOKEN }}
        run: python scripts/sync_site_watchlist.py --output data/site-watchlist.json
      - name: Restore durable alert state
        id: restore
        if: contains(fromJSON('["check","check-only","test-digest"]'), steps.action.outputs.action)
        run: python scripts/action_state.py restore
      - name: Check completed closes or run the selected utility
        id: monitor
        env:
          ALERT_ACTION: ${{ steps.action.outputs.action }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          case "$ALERT_ACTION" in
            check) python -m stock_alert.cloud --config data/site-watchlist.json --digest --persist-state ;;
            check-only) python -m stock_alert.cloud --config data/site-watchlist.json --check-only ;;
            test-digest) python -m stock_alert.cloud --config data/site-watchlist.json --test-digest --persist-state ;;
            test-email) python -m stock_alert.cloud --test-email ;;
            lookup) python -m stock_alert.cloud --lookup "$LOOKUP_MARKET" "$LOOKUP_TICKER" ;;
            skip) echo '한국 시간 화~토 오전 7시 이후에만 정기 발송합니다.' ;;
            *) echo '알 수 없는 실행 작업입니다.'; exit 1 ;;
          esac
      - name: Save state even after a partial failure
        if: always() && steps.restore.outcome == 'success' && steps.monitor.outcome != 'skipped'
        run: python scripts/action_state.py save
      - name: Explain execution schedule
        if: always()
        shell: bash
        run: |
          {
            echo '### 종가 알림 · GitHub 자체 예약'
            echo '화~토 오전 7시 Asia/Seoul. 7시 20분에 누락을 재확인하며 같은 날짜 메일은 중복 발송하지 않습니다.'
            echo 'GitHub가 비공개 사이트의 최신 종목 목록을 직접 읽습니다. 조회 실패 시 과거 목록으로 발송하지 않습니다.'
            echo '발신 royhan88888@gmail.com / 수신 ykhan@dacpole.com'
            echo '등록 종목은 목표 범위 일치 여부와 관계없이 한 표로 보냅니다. 도달 종목을 먼저, 빨간색으로 표시합니다.'
            echo '종목 관리: https://close-watch-list.hansharedid.chatgpt.site/'
            echo '필요한 Secret: SITE_SERVICE_TOKEN, 기존 SMTP_PASSWORD. 발송 기록: alert-state 브랜치.'
            echo 'GitHub 예약은 대기열 사정에 따라 시작이 늦어질 수 있습니다.'
          } >> "$GITHUB_STEP_SUMMARY"
